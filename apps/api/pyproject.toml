[project]
name = "repwise-api"
version = "0.1.0"
description = "RepWise evidence-linked exercise analysis API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.17.2",
    "celery[redis]==5.5.3",
    "fastapi==0.121.1",
    "psycopg[binary]==3.2.12",
    "pydantic-settings==2.11.0",
    "sqlalchemy[asyncio]==2.0.44",
    "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
    "aiosqlite==0.21.0",
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.0.1",
    "pytest-cov==7.0.0",
    "ruff==0.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repwise_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=repwise_api --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["repwise_api"]

[[tool.mypy.overrides]]
module = ["repwise_api.smoke", "repwise_api.worker"]
disable_error_code = ["import-untyped"]

[tool.coverage.run]
branch = true
source = ["repwise_api"]
