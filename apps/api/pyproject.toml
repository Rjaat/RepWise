[project]
name = "repwise-api"
version = "0.1.0"
description = "RepWise evidence-linked exercise analysis API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "celery[redis]==5.7.0",
    "fastapi==0.162.7",
    "minio==7.2.20",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repwise_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=repwise_api --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["repwise_api"]

[[tool.mypy.overrides]]
module = ["repwise_api.smoke", "repwise_api.worker"]
disable_error_code = ["import-untyped"]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
source = ["repwise_api"]
